<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Navecitas: gestión de registros marítimos, expedientes, documentos y trámites.">
  <title>Alta de usuarios internos — Navecitas</title>
  <link rel="stylesheet" href="/css/app.css">

<link rel="stylesheet" href="/css/sereno.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/navegacion.css">
</head>
<body>
<header class="barra barra-nueva">
  <a class="app-marca" href="/" aria-label="Navecitas, ir al inicio">
    <span class="app-marca-simbolo" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 28 24 21l19 7-6 11H11L5 28ZM14 23V13h20v10M21 13V7h6v6M4 43c6-6 10 6 17 0s11 6 17 0 9 2 9 2"/></svg></span>
    <span class="app-marca-texto"><strong>Navecitas</strong><small>GESTIÓN MARÍTIMA</small></span>
  </a>
  <button class="app-menu-boton" id="app-menu-boton" type="button" aria-controls="app-navegacion" aria-expanded="false" aria-label="Abrir menú de navegación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menú</span>
  </button>
  <nav id="app-navegacion" class="app-navegacion" aria-label="Navegación principal"></nav>
  <span class="derecha app-sesion" id="sesion" aria-label="Cuenta conectada"></span>
</header>

<main class="estrecho">
<section class="encabezado-pagina" aria-label="Cabecera de la sección">
  <div class="encabezado-pagina__tarjeta">
    <div class="encabezado-pagina__fila">
      <span class="encabezado-pagina__icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19a4 4 0 0 0-8 0"/><circle cx="11" cy="9" r="3"/><path d="M18 8v6"/><path d="M15 11h6"/></svg></span>
    <div class="encabezado-pagina__contenido">
      <span class="encabezado-pagina__etiqueta">NAVECITAS / PLATAFORMA</span>
      <h2>Crear usuario interno</h2>
    </div>
    </div>
    <p class="sumario">Registre un funcionario DGMM o un auditor. La persona deberá confirmar su correo para iniciar sesión</p>
  </div>
</section>

  <form class="tarjeta" id="form-alta" novalidate>
    <div class="campo">
      <label for="nombreCompleto">Nombre completo</label>
      <input type="text" id="nombreCompleto"
             name="nombreCompleto" maxlength="150" required>
      <span class="error-campo" data-error="nombreCompleto"></span>
    </div>

    <div class="campo">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo"
             maxlength="120" autocomplete="off" required>
      <span class="error-campo" data-error="correo"></span>
    </div>

    <div class="campo">
      <label for="password">
        Contraseña inicial
        <span class="pista">(mínimo 8 caracteres)</span>
      </label>
      <input type="password" id="password" name="password"
             minlength="8" maxlength="72"
             autocomplete="new-password" required>
      <span class="error-campo" data-error="password"></span>
    </div>

    <div class="campo">
      <label for="rol">Rol</label>
      <select id="rol" name="rol" required>
        <option value="">Seleccione un rol</option>
        <option value="FUNCIONARIO_DGMM">Funcionario DGMM</option>
        <option value="AUDITOR">Auditor</option>
      </select>
      <span class="error-campo" data-error="rol"></span>
    </div>

    <div class="acciones">
      <button type="submit" id="btn-crear">Crear usuario</button>

    </div>

    <p class="veredicto" id="aviso-alta"
       role="status" aria-live="polite"></p>
  </form>
</main>

<script src="/js/comun.js"></script><script>
  pintarSesion();
  function tokenCsrf() {
    const coincidencia = document.cookie.match(
      /(?:^|; )XSRF-TOKEN=([^;]+)/
    );
    return coincidencia ? decodeURIComponent(coincidencia[1]) : '';
  }

  const formulario = document.getElementById('form-alta');
  const boton = document.getElementById('btn-crear');
  const aviso = document.getElementById('aviso-alta');

  formulario.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    if (boton.disabled) return;

    document.querySelectorAll('[data-error]').forEach(elemento => {
      elemento.textContent = '';
    });
    aviso.textContent = '';
    delete aviso.dataset.estado;

    if (!formulario.reportValidity()) return;

    const cuerpo = {
      nombreCompleto: document.getElementById('nombreCompleto').value.trim(),
      correo: document.getElementById('correo').value.trim(),
      password: document.getElementById('password').value,
      rol: document.getElementById('rol').value
    };

    boton.disabled = true;
    boton.textContent = 'Creando usuario…';
    aviso.dataset.estado = 'neutro';
    aviso.textContent = 'Registrando el usuario. Espere un momento.';

    try {
      const respuesta = await fetch('/api/admin/usuarios', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-XSRF-TOKEN': tokenCsrf()
        },
        body: JSON.stringify(cuerpo)
      });

      if (respuesta.status === 401) {
        aviso.dataset.estado = 'ocupado';
        aviso.textContent = 'Su sesión terminó. Inicie sesión nuevamente.';
        return;
      }

      if (respuesta.status === 403) {
        aviso.dataset.estado = 'ocupado';
        aviso.textContent =
          'La solicitud fue rechazada. Compruebe que ingresó como administrador y recargue la página antes de reintentar.';
        return;
      }

      const datos = await respuesta.json();

      if (respuesta.status === 201) {
        aviso.dataset.estado = 'libre';
        notificar('Usuario registrado correctamente. Debe validar su correo antes de iniciar sesión.');
        formulario.reset();
        aviso.textContent =
          'Usuario creado: ' + datos.correo +
          '. Debe confirmar su correo antes de iniciar sesión.';
        return;
      }

      if (datos.campos) {
        Object.entries(datos.campos).forEach(([campo, mensaje]) => {
          const destino = document.querySelector(
            '[data-error="' + campo + '"]'
          );
          if (destino) destino.textContent = mensaje;
        });
      }

      aviso.dataset.estado = 'ocupado';
      aviso.textContent = datos.mensaje || 'No se pudo crear el usuario.';
    } catch (error) {
      aviso.dataset.estado = 'ocupado';
      aviso.textContent =
        'No se pudo confirmar la creación. Compruebe la conexión antes de reintentar.';
    } finally {
      boton.disabled = false;
      boton.textContent = 'Crear usuario';
    }
  });
</script>

<footer class="app-pie"><span>© 2026 Navecitas · Plataforma académica de registro marítimo. Sin validez oficial.</span></footer>
<script src="/js/navegacion.js" defer></script>
</body>
</html>

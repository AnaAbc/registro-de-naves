<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Consulta y seguimiento de tus naves registradas en Navecitas.">
<title>Mis naves — Navecitas</title>
<link rel="preload" href="/css/fuentes/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/sereno.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/navegacion.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="barra barra-nueva">
  <a class="app-marca" href="/" aria-label="Navecitas, ir al inicio">
    <span class="app-marca-simbolo" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 28 24 21l19 7-6 11H11L5 28ZM14 23V13h20v10M21 13V7h6v6M4 43c6-6 10 6 17 0s11 6 17 0 9 2 9 2"/></svg></span>
    <span class="app-marca-texto"><strong>Navecitas</strong><small>GESTIÓN MARÍTIMA</small></span>
  </a>
  <button class="app-menu-boton" id="app-menu-boton" type="button" aria-controls="app-navegacion" aria-expanded="false" aria-label="Abrir menú de navegación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menú</span>
  </button>
  <nav id="app-navegacion" class="app-navegacion" aria-label="Navegación principal"></nav>
  <span class="derecha app-sesion" id="sesion" aria-label="Cuenta conectada"></span>
</header>
<main>
<section class="encabezado-pagina" aria-label="Cabecera de la sección">
  <div class="encabezado-pagina__tarjeta">
    <div class="encabezado-pagina__fila">
      <span class="encabezado-pagina__icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13 12 10l9 3-3 6H6l-3-6Z"/><path d="M7 10V6h10v4"/><path d="M10 6V3h4v3"/><path d="M2 21c2-2 4 2 6 0s4 2 6 0 4 2 6 0 4 0 4 0"/></svg></span>
    <div class="encabezado-pagina__contenido">
      <span class="encabezado-pagina__etiqueta">NAVECITAS / PLATAFORMA</span>
      <h2>Mis naves</h2>
    </div>
    </div>
    <p class="sumario">Consulta tus naves y abre sus expedientes para dar seguimiento a los trámites</p>
  </div>
</section>
  <!-- ============ Naves del usuario ============ -->
  <section class="tarjeta" id="seccion-mis-naves">
    <h3>Listado de naves</h3>

    <!-- HU-10: filtro por estado del tramite, con cuantas naves hay en cada uno.
         Lo pinta mis-naves.js con /api/naves/conteo-por-estado. -->
    <div class="chips-filtro" id="filtro-estado" role="group"
         aria-label="Filtrar por estado del trámite"></div>

    <p class="vacio oculto" id="sin-resultados" role="status" aria-live="polite"></p>

    <div class="tabla-desplazable" id="caja-lista-naves">
      <table class="apilable">
        <thead>
          <tr><th>Nombre</th><th>Tipo</th><th>TRB</th><th>Estado de la nave</th><th>Estado del trámite</th><th>Expediente</th></tr>
        </thead>
        <tbody id="lista-naves"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/js/comun.js"></script>
<script src="/js/mis-naves.js"></script>
<footer class="app-pie"><span>© 2026 Navecitas · Plataforma académica de registro marítimo. Sin validez oficial.</span></footer>

<script src="/js/navegacion.js" defer></script>
</body>
</html>

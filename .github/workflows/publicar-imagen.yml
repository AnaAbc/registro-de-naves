name: Publicar imagen de Navecitas (manual)

# Se ejecuta desde Actions, despues de revisar cambios en main.
# Nunca publica automaticamente un merge sin que el equipo lo autorice.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: registro_naves
          POSTGRES_USER: registro
          POSTGRES_PASSWORD: registro
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar Java, seguridad y pruebas integradas
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/registro_naves
          SPRING_DATASOURCE_USERNAME: registro
          SPRING_DATASOURCE_PASSWORD: registro
      - name: Verificar interfaz JavaScript
        run: node --test src/test/js/*.test.cjs
      - name: Nombre del contenedor en minusculas
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar (tras superar las pruebas)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
